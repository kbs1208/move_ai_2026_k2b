  <path d="M150 178 C 260 150, 380 96, 486 54" stroke="#ffffff" stroke-width="26" fill="none" stroke-linecap="round"/>
  <path d="M150 178 C 260 150, 380 96, 478 58" stroke="#2f6fb4" stroke-width="9" fill="none" stroke-linecap="round"/>
